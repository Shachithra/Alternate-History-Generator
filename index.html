<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono-Sim: Alternate History "What if?" Simulator</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Simulate fascinating alternate history timelines. Diverge from critical historical points, explore interactive branching paths, and view territorial maps that rewrite world history in real-time.">
    <meta name="keywords" content="alternate history, what if, historical simulator, timeline generator, branching paths, interactive map, roman empire, AI history">
    <meta name="author" content="Chrono-Sim team">
    
    <!-- Google Fonts: Outfit (headings) & Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Style System -->
    <link rel="stylesheet" href="index.css">
    
    <!-- React & ReactDOM (Production CDNs) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone for runtime JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- Main Application mount point -->
    <div id="root">
        <!-- Fallback loading visual while Babel parses React -->
        <div style="background-color: #0a0e17; color: #f8f9fa; font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1.5rem;">
            <div style="width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.05); border-radius: 50%; border-top-color: #3a86ff; animation: spin 1s linear infinite;"></div>
            <div style="font-size: 1.1rem; color: #3a86ff; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase;">Initializing Chrono-Engine...</div>
        </div>
    </div>

    <!-- Keyframe animation style for the fallback spinner -->
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Load scenarios database (safe to load via standard script tag under file://) -->
    <script src="scenarios.js"></script>
    
    <!-- React Application Logic Embedded to bypass file:// CORS policy -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
          const [activeScenario, setActiveScenario] = useState(null);
          const [timelineHistory, setTimelineHistory] = useState([]); // Array of node objects
          const [activeNode, setActiveNode] = useState(null);
          const [hoveredRegion, setHoveredRegion] = useState(null);
          const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });
          const [customPrompt, setCustomPrompt] = useState("");
          
          // API Settings
          const [apiKey, setApiKey] = useState("");
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [apiWarning, setApiWarning] = useState(false);
          const [apiError, setApiError] = useState(null);

          // Simulation State
          const [isGenerating, setIsGenerating] = useState(false);
          const [generatorLogs, setGeneratorLogs] = useState([]);
          const [currentView, setCurrentView] = useState("home"); // home, simulator, custom-loading

          // Load Saved API key
          useEffect(() => {
            const savedKey = localStorage.getItem("chrono_sim_gemini_key");
            const defaultKey = "AIzaSyCIH01CCNs_zceS7y6q04zsQT2i6QWRHKw";
            if (!savedKey || savedKey === "AQ.Ab8RN6Iac8OcXP665hF-It-pOnlvA8-FV0RHKqNdbvzj5qA6QQ") {
              setApiKey(defaultKey);
              localStorage.setItem("chrono_sim_gemini_key", defaultKey);
            } else {
              setApiKey(savedKey);
            }
          }, []);

          const saveApiKey = (key) => {
            const trimmed = key.trim();
            setApiKey(trimmed);
            if (trimmed) {
              localStorage.setItem("chrono_sim_gemini_key", trimmed);
            } else {
              localStorage.removeItem("chrono_sim_gemini_key");
            }
            setIsSettingsOpen(false);
            setApiWarning(false);
          };

          const startScenario = (scenarioId) => {
            const scenario = window.SCENARIOS[scenarioId];
            setActiveScenario(scenario);
            const rootNode = scenario.nodes.root;
            setTimelineHistory([rootNode]);
            setActiveNode(rootNode);
            setCurrentView("simulator");
          };

          const handleSelectChoice = (choice) => {
            if (!activeScenario || !activeNode) return;
            const nextNode = activeScenario.nodes[choice.nextNodeId];
            if (nextNode) {
              const updatedHistory = [...timelineHistory, nextNode];
              setTimelineHistory(updatedHistory);
              setActiveNode(nextNode);
            }
          };

          const handleRollback = (index) => {
            const updatedHistory = timelineHistory.slice(0, index + 1);
            setTimelineHistory(updatedHistory);
            setActiveNode(updatedHistory[updatedHistory.length - 1]);
          };

          const handleReset = () => {
            setActiveScenario(null);
            setTimelineHistory([]);
            setActiveNode(null);
            setApiWarning(false);
            setApiError(null);
            setCurrentView("home");
          };

          // Main Custom Prompt Submission
          const handleCustomSubmit = async (e, forceLocal = false) => {
            if (e) e.preventDefault();
            if (!customPrompt.trim()) return;

            // Check if API key is present
            if (!apiKey && !forceLocal) {
              setApiWarning(true);
              return;
            }

            setApiWarning(false);
            setIsGenerating(true);
            setCurrentView("custom-loading");
            setGeneratorLogs(["INITIALIZING CHRONO-CORE..."]);

            if (forceLocal || !apiKey) {
              // Simulated Fallback mode
              runLocalSimulation();
              return;
            }

            // Real API mode
            runRealAISimulation();
          };

          // FALLBACK LOCAL MOCK SIMULATOR
          const runLocalSimulation = () => {
            const logs = [
              "PARSING PROMPT KEYWORDS LOCAL...",
              "LOADING FALLBACK SCENARIO SECTORS...",
              "STABILIZING QUANTUM TIMELINE BRANCHES...",
              "TIMELINE PREVIEW COMPLETE. LAUNCHING CHRONO-VIEWER."
            ];

            let index = 0;
            const timer = setInterval(() => {
              if (index < logs.length) {
                setGeneratorLogs((prev) => [...prev, logs[index]]);
                index++;
              } else {
                clearInterval(timer);
                const promptLower = customPrompt.toLowerCase();
                let customScenario = null;

                if (promptLower.includes("alexandria") || promptLower.includes("library") || promptLower.includes("egypt")) {
                  customScenario = getAlexandriaScenario(customPrompt);
                } else if (promptLower.includes("napoleon") || promptLower.includes("french") || promptLower.includes("waterloo")) {
                  customScenario = getNapoleonScenario(customPrompt);
                } else if (promptLower.includes("mongol") || promptLower.includes("khan") || promptLower.includes("asia")) {
                  customScenario = getMongolScenario(customPrompt);
                } else {
                  customScenario = getGenericScenario(customPrompt);
                }

                window.SCENARIOS[customScenario.id] = customScenario;
                setActiveScenario(customScenario);
                setTimelineHistory([customScenario.nodes.root]);
                setActiveNode(customScenario.nodes.root);
                setIsGenerating(false);
                setCurrentView("simulator");
              }
            }, 800);
          };

          // DYNAMIC AI PREDICTOR VIA GEMINI API
          const runRealAISimulation = async () => {
            const addLog = (text) => setGeneratorLogs(prev => [...prev, text]);
            
            try {
              addLog("CONNECTING TO GEMINI TEMPORAL CORE...");
              addLog("TRANSMITTING DIVERGENCE PROMPT...");

              const systemInstruction = `
You are a historical prediction engine for a "What If?" alternate history simulator. 
The user will provide a scenario prompt describing a divergence point in history.
You must analyze this divergence point and predict a plausible, highly detailed branching alternate timeline.
You MUST respond with a single, raw JSON object (with NO markdown formatting, NO \`\`\`json blocks) that conforms EXACTLY to the following schema.

Schema:
{
  "id": "unique_id_string",
  "title": "Short descriptive title of the alternate history (e.g., 'What if X?')",
  "description": "A 2-3 sentence overview of the historical deviation and its overarching theme.",
  "color": "A hex color code suitable for the theme (e.g., '#e63946' for militaristic/roman, '#06d6a0' for science/growth, '#ffb703' for industrial/steampunk)",
  "gradient": "A CSS linear gradient string matching the color (e.g., 'linear-gradient(135deg, #3a86ff 0%, #1e3a8a 100%)')",
  "startYear": "The year of the divergence point (e.g., '1945 AD' or '44 BC')",
  "nodes": {
    "root": {
      "id": "root",
      "title": "Title of the divergence point event",
      "year": "The year (matching startYear)",
      "summary": "1-2 sentence summary of what happens immediately at this divergence point.",
      "details": "A detailed paragraph (3-4 sentences) describing the historical context, how the divergence happened, the direct consequences, and the immediate geopolitical reaction.",
      "effects": [
        {"type": "science", "label": "e.g. +30% Technological Progress"},
        {"type": "stability", "label": "e.g. -20% Colonial Unrest"}
      ],
      "mapState": {
        "western_rome": {"status": "Name of status", "color": "Hex color code", "label": "Name of controlling power or region"},
        "eastern_rome": {"status": "...", "color": "...", "label": "..."},
        "germania": {"status": "...", "color": "...", "label": "..."},
        "persia": {"status": "...", "color": "...", "label": "..."},
        "asia": {"status": "...", "color": "...", "label": "..."},
        "americas": {"status": "...", "color": "...", "label": "..."},
        "africa": {"status": "...", "color": "...", "label": "..."}
      },
      "choices": [
        {"text": "A description of Choice A that the player can make", "nextNodeId": "choice_a"},
        {"text": "A description of Choice B that the player can make", "nextNodeId": "choice_b"}
      ]
    },
    "choice_a": {
      "id": "choice_a",
      "title": "Title of event resulting from Choice A",
      "year": "Approximate year of this event (e.g. 10-30 years after root)",
      "summary": "1-2 sentence summary of the consequences of Choice A.",
      "details": "A detailed paragraph describing the result of this choice, social/industrial reforms, and geographic changes.",
      "effects": [
        {"type": "economy", "label": "..."},
        {"type": "stability", "label": "..."}
      ],
      "mapState": {
        "western_rome": {"status": "...", "color": "...", "label": "..."},
        "eastern_rome": {"status": "...", "color": "...", "label": "..."},
        "germania": {"status": "...", "color": "...", "label": "..."},
        "persia": {"status": "...", "color": "...", "label": "..."},
        "asia": {"status": "...", "color": "...", "label": "..."},
        "americas": {"status": "...", "color": "...", "label": "..."},
        "africa": {"status": "...", "color": "...", "label": "..."}
      },
      "choices": []
    },
    "choice_b": {
      "id": "choice_b",
      "title": "Title of event resulting from Choice B",
      "year": "Approximate year of this event",
      "summary": "1-2 sentence summary of the consequences of Choice B.",
      "details": "A detailed paragraph describing the result of this choice.",
      "effects": [
        {"type": "military", "label": "..."},
        {"type": "stability", "label": "..."}
      ],
      "mapState": {
        "western_rome": {"status": "...", "color": "...", "label": "..."},
        "eastern_rome": {"status": "...", "color": "...", "label": "..."},
        "germania": {"status": "...", "color": "...", "label": "..."},
        "persia": {"status": "...", "color": "...", "label": "..."},
        "asia": {"status": "...", "color": "...", "label": "..."},
        "americas": {"status": "...", "color": "...", "label": "..."},
        "africa": {"status": "...", "color": "...", "label": "..."}
      },
      "choices": []
    }
  }
}

Regions definitions:
- "americas": North and South America
- "western_rome": Western Europe / Mediterranean (UK, France, Spain, Italy)
- "germania": Northern and Eastern Europe (Germany, Scandinavia, Poland)
- "eastern_rome": Greece, Anatolia, Egypt, Levant
- "persia": Middle East, Arabia, Iran, Iraq
- "asia": India, China, Russia, East Asia
- "africa": Sub-Saharan Africa

For each mapState region, customize the "label", "status", and "color" to accurately match your prediction of the political landscape at that point in the timeline. Use the main scenario color for the dominant empire, and other distinct hex colors for other powers. Keep neutral regions dark gray (#1b2336).

Crucial Instruction: Respond ONLY with a valid JSON block. Do not include markdown code block syntax. Ensure all JSON fields are validly quoted and formatted.
`;

              const prompt = `Simulate this alternate history scenario: "${customPrompt}"`;

              addLog("CALCULATING TEMPORAL ANOMALIES...");
              
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                  },
                  body: JSON.stringify({
                    contents: [
                      {
                        role: "user",
                        parts: [
                          { text: systemInstruction + "\n\nPrompt: " + prompt }
                        ]
                      }
                    ],
                    generationConfig: {
                      responseMimeType: "application/json"
                    }
                  })
                }
              );

              if (!response.ok) {
                let errorDetails = `Status ${response.status}`;
                try {
                  const errJson = await response.json();
                  if (errJson.error && errJson.error.message) {
                    errorDetails = errJson.error.message;
                  }
                } catch(e) {}
                throw new Error(`Gemini API Error: ${errorDetails}`);
              }

              const data = await response.json();
              addLog("DECRYPTING STATE VECTORS...");

              let responseText = data.candidates[0].content.parts[0].text;
              // Strip markdown json block wrappers if the AI included them
              responseText = responseText.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();

              const customScenario = JSON.parse(responseText);
              
              if (!customScenario.id) {
                customScenario.id = `custom_ai_${Date.now()}`;
              }

              addLog("STABILIZING CHRONO-PORTAL...");
              
              setApiError(null);
              window.SCENARIOS[customScenario.id] = customScenario;
              setActiveScenario(customScenario);
              setTimelineHistory([customScenario.nodes.root]);
              setActiveNode(customScenario.nodes.root);
              setIsGenerating(false);
              setCurrentView("simulator");
            } catch (err) {
              console.error(err);
              addLog(`CRITICAL ERROR: ${err.message}`);
              setApiError(err.message);
              addLog("TEMPORAL COLLAPSE. REVERTING TO FALLBACK SIMULATION...");
              
              // Fallback to simulated local model
              setTimeout(() => {
                runLocalSimulation();
              }, 2500);
            }
          };

          return (
            <div className="app-container">
              <header className="app-header">
                <div className="logo" onClick={handleReset}>
                  <i className="bi bi-clock-history"></i>
                  <span>CHRONO-SIM</span>
                </div>
                
                <div style={{ display: "flex", alignItems: "center", gap: "1rem" }}>
                  <button className="settings-btn" onClick={() => setIsSettingsOpen(true)} title="Configure API Key">
                    <i className="bi bi-gear-fill"></i>
                  </button>
                  {currentView !== "home" && (
                    <button className="btn btn-secondary" onClick={handleReset}>
                      <i className="bi bi-house"></i> Back to Scenarios
                    </button>
                  )}
                </div>
              </header>

              <main className="main-content">
                {currentView === "home" && (
                  <HomeView 
                    startScenario={startScenario} 
                    customPrompt={customPrompt}
                    setCustomPrompt={setCustomPrompt}
                    handleCustomSubmit={handleCustomSubmit}
                    apiWarning={apiWarning}
                    setApiWarning={setApiWarning}
                  />
                )}

                {currentView === "custom-loading" && (
                  <div className="glass-card" style={{ maxWidth: "700px", margin: "3rem auto" }}>
                    <div className="prompt-loading-spinner">
                      <div className="spinner"></div>
                      <div className="loading-text">GEMINI PREDICTING TIMELINE</div>
                    </div>
                    <div className="terminal-simulate">
                      {generatorLogs.map((log, index) => (
                        <div key={index} className="terminal-line">&gt; {log}</div>
                      ))}
                    </div>
                  </div>
                )}

                {currentView === "simulator" && activeScenario && (
                  <div className="simulator-layout">
                    <div className="left-panel">
                      <TimelineCard 
                        timelineHistory={timelineHistory}
                        activeNode={activeNode}
                        handleRollback={handleRollback}
                        handleSelectChoice={handleSelectChoice}
                        apiError={apiError}
                      />
                    </div>
                    
                    <div className="right-panel">
                      <div style={{ padding: "1.5rem", borderBottom: "1px solid var(--glass-border)", background: "rgba(255,255,255,0.01)" }}>
                        <h2 style={{ fontSize: "1.3rem", display: "flex", alignItems: "center", gap: "0.5rem" }}>
                          <i className="bi bi-geo-alt-fill" style={{ color: activeScenario.color }}></i>
                          Geopolitical Chrono-Map ({activeNode.year})
                        </h2>
                        <p style={{ fontSize: "0.85rem", color: "var(--text-muted)", marginTop: "0.25rem" }}>
                          Hover over regions to view territorial details. Map updates dynamically based on choices.
                        </p>
                      </div>

                      <InteractiveMap 
                        activeNode={activeNode}
                        hoveredRegion={hoveredRegion}
                        setHoveredRegion={setHoveredRegion}
                        tooltipPos={tooltipPos}
                        setTooltipPos={setTooltipPos}
                        themeColor={activeScenario.color}
                      />
                    </div>
                  </div>
                )}
              </main>

              {/* SETTINGS MODAL */}
              {isSettingsOpen && (
                <div className="modal-overlay">
                  <div className="glass-card modal-content">
                    <div className="modal-header">
                      <h3 style={{ fontSize: "1.25rem", display: "flex", alignItems: "center", gap: "0.5rem" }}>
                        <i className="bi bi-gear-fill" style={{ color: "var(--accent-primary)" }}></i>
                        Chrono-Engine Settings
                      </h3>
                      <button className="modal-close" onClick={() => setIsSettingsOpen(false)}>
                        <i className="bi bi-x-lg"></i>
                      </button>
                    </div>
                    
                    <SettingsForm 
                      apiKey={apiKey} 
                      onSave={saveApiKey} 
                      onClose={() => setIsSettingsOpen(false)} 
                    />
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ----------------- COMPONENT: SettingsForm -----------------
        function SettingsForm({ apiKey, onSave, onClose }) {
          const [keyInput, setKeyInput] = useState(apiKey);

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(keyInput);
          };

          return (
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label htmlFor="api-key-input">Gemini API Key</label>
                <input 
                  id="api-key-input"
                  type="password" 
                  className="custom-input" 
                  style={{ width: "100%", background: "rgba(0,0,0,0.4)" }}
                  placeholder="Paste Gemini API Key here..."
                  value={keyInput}
                  onChange={(e) => setKeyInput(e.target.value)}
                />
                <p className="form-help">
                  An API key is required to predict detailed custom scenarios. You can get a free key in under 1 minute from 
                  <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer"> Google AI Studio <i className="bi bi-box-arrow-up-right" style={{ fontSize: "0.7rem" }}></i></a>.
                  Your key is saved locally in your browser.
                </p>
              </div>

              <div style={{ display: "flex", justifyContent: "flex-end", gap: "0.75rem", marginTop: "2rem" }}>
                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save Key</button>
              </div>
            </form>
          );
        }

        // ----------------- COMPONENT: HomeView -----------------
        function HomeView({ startScenario, customPrompt, setCustomPrompt, handleCustomSubmit, apiWarning, setApiWarning }) {
          const scenariosList = Object.values(window.SCENARIOS).filter(s => s.id !== "custom_alexandria" && s.id !== "custom_napoleon" && s.id !== "custom_mongol" && !s.id.startsWith("custom_generic"));

          return (
            <div>
              <div style={{ textAlign: "center", marginBottom: "3rem", marginTop: "1rem" }}>
                <h1 style={{ fontSize: "3rem", fontWeight: "900", marginBottom: "1rem", letterSpacing: "-0.03em" }}>
                  Alternate History <span style={{ color: "var(--accent-primary)" }}>Generator</span>
                </h1>
                <p style={{ fontSize: "1.15rem", color: "var(--text-muted)", maxWidth: "600px", margin: "0 auto", lineHeight: "1.6" }}>
                  Step into the crucible of time. Simulate divergent histories, make critical decisions, and watch maps and timelines rewrite themselves in real-time.
                </p>
              </div>

              <h2 style={{ fontSize: "1.6rem", marginBottom: "1.5rem" }}>
                Select a Pre-Authored Simulator
              </h2>
              
              <div className="scenarios-grid">
                {scenariosList.map((scenario) => {
                  let iconClass = "bi bi-question-circle";
                  if (scenario.icon === "shield") iconClass = "bi bi-shield-exclamation";
                  if (scenario.icon === "cpu") iconClass = "bi bi-cpu";

                  return (
                    <div 
                      key={scenario.id} 
                      className="glass-card scenario-card" 
                      style={{ "--card-color": scenario.color }}
                      onClick={() => startScenario(scenario.id)}
                    >
                      <div>
                        <div className="scenario-card-header">
                          <div className="scenario-card-icon" style={{ color: scenario.color }}>
                            <i className={iconClass}></i>
                          </div>
                          <div className="scenario-card-tag">{scenario.category}</div>
                        </div>
                        <h3 className="scenario-card-title">{scenario.title}</h3>
                        <p className="scenario-card-desc">{scenario.description}</p>
                      </div>
                      <div className="scenario-card-footer" style={{ color: scenario.color }}>
                        <span>Initialize Simulator</span>
                        <i className="bi bi-arrow-right"></i>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="glass-card custom-prompt-box" style={{ marginTop: "4rem" }}>
                <h3 style={{ fontSize: "1.4rem", marginBottom: "0.5rem", display: "flex", alignItems: "center", gap: "0.5rem" }}>
                  <i className="bi bi-sparkles" style={{ color: "var(--accent-secondary)" }}></i>
                  Predict a Custom "What if?" Scenario
                </h3>
                <p style={{ color: "var(--text-muted)", fontSize: "0.95rem" }}>
                  Type any historical deviation point (e.g., "What if the space race occurred in 1860?" or "What if the black plague never occurred?") and the engine will predict the branching simulation.
                </p>

                {apiWarning && (
                  <div className="warning-banner">
                    <i className="bi bi-exclamation-triangle-fill"></i>
                    <div>
                      <strong>Gemini API Key Required</strong>
                      <p style={{ marginTop: "0.25rem", fontSize: "0.8rem" }}>
                        To get an accurate dynamic prediction, please configure your API key in the **Settings** (gear icon in the top right). Alternatively, you can run a simulated preview below.
                      </p>
                      <div style={{ marginTop: "0.75rem", display: "flex", gap: "0.5rem" }}>
                        <button className="btn btn-secondary btn-sm" style={{ padding: "0.3rem 0.6rem", fontSize: "0.75rem" }} onClick={(e) => handleCustomSubmit(e, true)}>
                          Run Preview (Simulated)
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                <form onSubmit={(e) => handleCustomSubmit(e)} className="custom-input-group">
                  <input 
                    type="text" 
                    className="custom-input" 
                    placeholder="e.g. What if the Soviet Union won the Space Race?" 
                    value={customPrompt}
                    onChange={(e) => setCustomPrompt(e.target.value)}
                  />
                  <button type="submit" className="btn btn-accent">
                    <i className="bi bi-play-fill"></i> Predict Scenario
                  </button>
                </form>
              </div>
            </div>
          );
        }

        function TimelineCard({ timelineHistory, activeNode, handleRollback, handleSelectChoice, apiError }) {
          const containerRef = useRef(null);

          useEffect(() => {
            if (containerRef.current) {
              containerRef.current.scrollTop = containerRef.current.scrollHeight;
            }
          }, [timelineHistory]);

          const getRegionStyle = (regionId) => {
            const defaultColor = "#1b2336";

            if (state) {
              return {
                fill: state.color || themeColor,

              };
            }

            return {
              fill: defaultColor,
              fillOpacity: hoveredRegion === regionId ? 0.4 : 0.25,
            };
          };

          const activeRegionData = activeNode.mapState && hoveredRegion && activeNode.mapState[hoveredRegion];

          return (
            <div className="map-container" onMouseMove={handleMouseMove}>
              <svg className="world-svg" viewBox="0 0 1000 500">
                <defs>
                  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">

                    className="map-region"
